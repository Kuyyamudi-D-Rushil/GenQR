{% extends "base.html" %}

{% block title %}Sign in | CloudQR{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card p-4 p-sm-4 shadow-sm">
                <div class="text-center mb-4">
                    <div class="nav-brand-icon mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.35rem;">
                        <i class="bi bi-qr-code"></i>
                    </div>
                    <h2 class="h4 fw-bold mb-1" style="color: var(--text-primary);">Sign in to CloudQR</h2>
                    <p class="text-secondary small mb-0">Enter your credentials to access your cloud dashboard</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@company.com" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control border-end-0" id="password" name="password" placeholder="••••••••" required>
                            <button class="btn btn-secondary-subtle border-start-0" type="button" id="togglePasswordBtn">
                                <i class="bi bi-eye text-secondary" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
                            <label class="form-check-label text-secondary small" for="remember">
                                Remember this device
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3 py-2 fw-semibold">
                        Sign in
                    </button>

                    <div class="text-center">
                        <span class="text-secondary small">Don't have an account? </span>
                        <a href="{{ url_for('auth.register') }}" class="fw-semibold small">Sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const toggleBtn = document.getElementById("togglePasswordBtn");
    const pwdInput = document.getElementById("password");
    const pwdIcon = document.getElementById("togglePasswordIcon");
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener("click", function() {
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                pwdIcon.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                pwdInput.type = "password";
                pwdIcon.classList.replace("bi-eye-slash", "bi-eye");
            }
        });
    }
});
</script>
{% endblock %}
