{% extends "base.html" %}

{% block title %}Create Account | CloudQR{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card p-4 p-sm-4 shadow-sm">
                <div class="text-center mb-4">
                    <div class="nav-brand-icon mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.35rem;">
                        <i class="bi bi-qr-code"></i>
                    </div>
                    <h2 class="h4 fw-bold mb-1" style="color: var(--text-primary);">Create your account</h2>
                    <p class="text-secondary small mb-0">Generate, customize, and store QR codes in PostgreSQL</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" placeholder="alex_dev" required autofocus minlength="3" maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="alex@company.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password <span class="text-secondary fw-normal">(min 12 characters)</span></label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••••••" required minlength="12">
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••••••" required minlength="12">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3 py-2 fw-semibold">
                        Create free account
                    </button>

                    <div class="text-center">
                        <span class="text-secondary small">Already have an account? </span>
                        <a href="{{ url_for('auth.login') }}" class="fw-semibold small">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
